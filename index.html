<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>67 Speed Challenge</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* Top-right Leaderboard */
    .leaderboard {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 185px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }
    .leaderboard h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #ffd700;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 5px;
    }
    .rank-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin: 5px 0;
    }
    .rank-name {
      max-width: 105px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rank-score {
      font-weight: bold;
      color: #4ecca3;
    }
    /* Main Game Card */
    .game-container {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 25px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-top: 80px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.25);
      padding: 15px;
      border-radius: 12px;
    }
    .stat-box span {
      display: block;
      font-size: 12px;
      color: #bbb;
    }
    .stat-box strong {
      font-size: 28px;
      color: #4ecca3;
    }
    #timer {
      color: #ff6b6b;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 15px;
      font-size: 22px;
      text-align: center;
      border: 2px solid #4ecca3;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      outline: none;
      margin-bottom: 15px;
    }
    input:disabled {
      border-color: #555;
      opacity: 0.6;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #4ecca3;
      color: #1a1a2e;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.97);
    }
    /* Result & Nickname Box */
    .result-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }
    .result-box input {
      font-size: 16px;
      padding: 12px;
    }
    .btn-secondary {
      background: #393e46;
      color: #fff;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Top-Right Top 3 Leaderboard -->
  <div class="leaderboard">
    <h3>🏆 All-Time Top 3</h3>
    <div id="rank-list"></div>
  </div>

  <!-- Main Game Area -->
  <div class="game-container">
    <h1>67 Challenge</h1>
    <p class="subtitle">Type "67" as fast as you can in 10s! 1 pt each.</p>

    <div class="stats">
      <div class="stat-box">
        <span>Time Left</span>
        <strong id="timer">10.0s</strong>
      </div>
      <div class="stat-box">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
    </div>

    <input type="tel" id="game-input" inputmode="numeric" placeholder="Tap Start or type 67" autocomplete="off">
    <button id="start-btn" onclick="startGame()">Start Challenge</button>

    <!-- Game Over & Nickname Entry -->
    <div class="result-box" id="result-box">
      <p style="margin: 0 0 10px 0; font-size: 16px;">Time's Up! Final Score: <strong id="final-score" style="color:#ffd700;">0</strong> pts</p>
      <input type="text" id="nickname-input" maxlength="12" placeholder="Enter your nickname">
      <button onclick="saveScore()">Save Score</button>
      <button class="btn-secondary" onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    let score = 0;
    let timeLeft = 10.0;
    let timerInterval = null;
    let isPlaying = false;
    let isFinished = false;

    const gameInput = document.getElementById('game-input');
    const timerDisplay = document.getElementById('timer');
    const scoreDisplay = document.getElementById('score');
    const startBtn = document.getElementById('start-btn');
    const resultBox = document.getElementById('result-box');
    const finalScoreDisplay = document.getElementById('final-score');
    const nicknameInput = document.getElementById('nickname-input');

    // Default Top 3 Leaderboard
    const defaultScores = [
      { name: "SpeedKing", score: 28 },
      { name: "FastFingers", score: 22 },
      { name: "Rookie67", score: 15 }
    ];

    function getLeaderboard() {
      const saved = localStorage.getItem('67_challenge_ranks_en');
      return saved ? JSON.parse(saved) : defaultScores;
    }

    function renderLeaderboard() {
      const ranks = getLeaderboard();
      const medals = ["🥇", "🥈", "🥉"];
      const rankList = document.getElementById('rank-list');
      rankList.innerHTML = ranks.slice(0, 3).map((item, index) => `
        <div class="rank-item">
          <span class="rank-name">${medals[index]} ${item.name}</span>
          <span class="rank-score">${item.score} pts</span>
        </div>
      `).join('');
    }

    // Start Game
    function startGame() {
      if (isPlaying) return;
      if (isFinished) resetGame();

      isPlaying = true;
      startBtn.style.display = 'none';
      gameInput.disabled = false;
      gameInput.value = '';
      gameInput.placeholder = 'Type 67 fast!';
      gameInput.focus();

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          endGame();
        }
        timerDisplay.textContent = timeLeft.toFixed(1) + 's';
      }, 100);
    }

    // Listen for "67" input
    gameInput.addEventListener('input', (e) => {
      if (isFinished) return;
      if (!isPlaying) {
        startGame();
      }

      const val = gameInput.value;
      if (val.includes('67')) {
        score++;
        scoreDisplay.textContent = score;
        gameInput.value = '';
      } else if (val.length >= 2) {
        gameInput.value = val.endsWith('6') ? '6' : '';
      } else if (val !== '6') {
        gameInput.value = '';
      }
    });

    // End Game
    function endGame() {
      clearInterval(timerInterval);
      isPlaying = false;
      isFinished = true;
      gameInput.disabled = true;
      gameInput.value = '';
      gameInput.placeholder = "Time's Up!";
      finalScoreDisplay.textContent = score;
      resultBox.style.display = 'block';
    }

    // Save Score to Leaderboard
    function saveScore() {
      const name = nicknameInput.value.trim() || 'Anonymous';
      const ranks = getLeaderboard();
      ranks.push({ name: name, score: score });
      ranks.sort((a, b) => b.score - a.score);
      localStorage.setItem('67_challenge_ranks_en', JSON.stringify(ranks.slice(0, 3)));
      renderLeaderboard();
      alert('Score saved!');
      resetGame();
    }

    // Reset Game
    function resetGame() {
      clearInterval(timerInterval);
      score = 0;
      timeLeft = 10.0;
      isPlaying = false;
      isFinished = false;
      scoreDisplay.textContent = '0';
      timerDisplay.textContent = '10.0s';
      gameInput.disabled = false;
      gameInput.value = '';
      gameInput.placeholder = 'Tap Start or type 67';
      startBtn.style.display = 'block';
      resultBox.style.display = 'none';
      nicknameInput.value = '';
    }

    // Initialize Leaderboard on load
    renderLeaderboard();
  </script>

  <script src="api.js"></script>
</body>
</html>
