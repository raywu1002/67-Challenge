<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>67 極限挑戰賽</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* 右上角排行榜 */
    .leaderboard {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 175px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }
    .leaderboard h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #ffd700;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 5px;
    }
    .rank-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin: 5px 0;
    }
    .rank-name {
      max-width: 95px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rank-score {
      font-weight: bold;
      color: #4ecca3;
    }
    /* 主遊戲卡片 */
    .game-container {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 25px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-top: 80px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.25);
      padding: 15px;
      border-radius: 12px;
    }
    .stat-box span {
      display: block;
      font-size: 12px;
      color: #bbb;
    }
    .stat-box strong {
      font-size: 28px;
      color: #4ecca3;
    }
    #timer {
      color: #ff6b6b;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 15px;
      font-size: 24px;
      text-align: center;
      border: 2px solid #4ecca3;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      outline: none;
      margin-bottom: 15px;
    }
    input:disabled {
      border-color: #555;
      opacity: 0.6;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #4ecca3;
      color: #1a1a2e;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.97);
    }
    /* 結束結算區塊 */
    .result-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }
    .result-box input {
      font-size: 16px;
      padding: 12px;
    }
    .btn-secondary {
      background: #393e46;
      color: #fff;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 右上角前三名排行榜 -->
  <div class="leaderboard">
    <h3>🏆 歷史最高前三名</h3>
    <div id="rank-list"></div>
  </div>

  <!-- 主遊戲區 -->
  <div class="game-container">
    <h1>67 極限挑戰</h1>
    <p class="subtitle">10 秒內瘋狂輸入「67」，每輸入一次得 1 分！</p>

    <div class="stats">
      <div class="stat-box">
        <span>剩餘時間</span>
        <strong id="timer">10.0s</strong>
      </div>
      <div class="stat-box">
        <span>目前得分</span>
        <strong id="score">0</strong>
      </div>
    </div>

    <input type="tel" id="game-input" inputmode="numeric" placeholder="點擊下方開始或直接輸入 67" autocomplete="off">
    <button id="start-btn" onclick="startGame()">開始挑戰</button>

    <!-- 遊戲結束輸入暱稱區 -->
    <div class="result-box" id="result-box">
      <p style="margin: 0 0 10px 0; font-size: 16px;">時間到！最終得分：<strong id="final-score" style="color:#ffd700;">0</strong> 分</p>
      <input type="text" id="nickname-input" maxlength="12" placeholder="輸入你的暱稱登錄排行">
      <button onclick="saveScore()">儲存成績</button>
      <button class="btn-secondary" onclick="resetGame()">再玩一次</button>
    </div>
  </div>

  <script>
    let score = 0;
    let timeLeft = 10.0;
    let timerInterval = null;
    let isPlaying = false;
    let isFinished = false;

    const gameInput = document.getElementById('game-input');
    const timerDisplay = document.getElementById('timer');
    const scoreDisplay = document.getElementById('score');
    const startBtn = document.getElementById('start-btn');
    const resultBox = document.getElementById('result-box');
    const finalScoreDisplay = document.getElementById('final-score');
    const nicknameInput = document.getElementById('nickname-input');

    // 初始化排行榜（若無紀錄則預設三筆示範成績）
    const defaultScores = [
      { name: "手速王者", score: 28 },
      { name: "神秘高手", score: 22 },
      { name: "路人甲", score: 15 }
    ];

    function getLeaderboard() {
      const saved = localStorage.getItem('67_challenge_ranks');
      return saved ? JSON.parse(saved) : defaultScores;
    }

    function renderLeaderboard() {
      const ranks = getLeaderboard();
      const medals = ["🥇", "🥈", "🥉"];
      const rankList = document.getElementById('rank-list');
      rankList.innerHTML = ranks.slice(0, 3).map((item, index) => `
        <div class="rank-item">
          <span class="rank-name">${medals[index]} ${item.name}</span>
          <span class="rank-score">${item.score} 分</span>
        </div>
      `).join('');
    }

    // 開始遊戲
    function startGame() {
      if (isPlaying) return;
      if (isFinished) resetGame();

      isPlaying = true;
      startBtn.style.display = 'none';
      gameInput.disabled = false;
      gameInput.value = '';
      gameInput.placeholder = '快輸入 67！';
      gameInput.focus();

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          endGame();
        }
        timerDisplay.textContent = timeLeft.toFixed(1) + 's';
      }, 100);
    }

    // 監聽輸入判定 67
    gameInput.addEventListener('input', (e) => {
      if (isFinished) return;
      // 若玩家直接點擊輸入框打字，也自動啟動計時
      if (!isPlaying) {
        startGame();
      }

      const val = gameInput.value;
      if (val.includes('67')) {
        score++;
        scoreDisplay.textContent = score;
        gameInput.value = ''; // 得分後自動清空，方便連續狂按
      } else if (val.length >= 2) {
        // 若按錯數字，保留最後一個字元（如果是6的話）或清空，避免卡住
        gameInput.value = val.endsWith('6') ? '6' : '';
      } else if (val !== '6') {
        gameInput.value = '';
      }
    });

    // 結束遊戲
    function endGame() {
      clearInterval(timerInterval);
      isPlaying = false;
      isFinished = true;
      gameInput.disabled = true;
      gameInput.value = '';
      gameInput.placeholder = '挑戰結束';
      finalScoreDisplay.textContent = score;
      resultBox.style.display = 'block';
    }

    // 儲存成績至排行榜
    function saveScore() {
      const name = nicknameInput.value.trim() || '無名玩家';
      const ranks = getLeaderboard();
      ranks.push({ name: name, score: score });
      ranks.sort((a, b) => b.score - a.score);
      localStorage.setItem('67_challenge_ranks', JSON.stringify(ranks.slice(0, 3)));
      renderLeaderboard();
      alert('成績已登錄！');
      resetGame();
    }

    // 重置遊戲
    function resetGame() {
      clearInterval(timerInterval);
      score = 0;
      timeLeft = 10.0;
      isPlaying = false;
      isFinished = false;
      scoreDisplay.textContent = '0';
      timerDisplay.textContent = '10.0s';
      gameInput.disabled = false;
      gameInput.value = '';
      gameInput.placeholder = '點擊下方開始或直接輸入 67';
      startBtn.style.display = 'block';
      resultBox.style.display = 'none';
      nicknameInput.value = '';
    }

    // 網頁載入時顯示排行榜
    renderLeaderboard();
  </script>

  <script src="api.js"></script>
</body>
</html>
